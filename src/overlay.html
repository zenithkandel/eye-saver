<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Rest Break</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
  <div class="overlay-container">
    <!-- Calm Ambient Blob Shape Animation -->
    <div class="ambient-bg"></div>

    <!-- Header Brand -->
    <header class="overlay-header">
      <svg class="overlay-brand-icon" viewBox="0 0 64 64" fill="none">
        <path d="M6 32C6 32 15.6 14 32 14C48.4 14 58 32 58 32C58 32 48.4 50 32 50C15.6 50 6 32 6 32Z" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="32" r="10" stroke="currentColor" stroke-width="4.5"/>
        <circle cx="35" cy="29" r="3" fill="currentColor"/>
      </svg>
      <span class="overlay-brand-title">Eye Saver</span>
    </header>

    <!-- Main Content Center -->
    <main class="overlay-content">
      <h1 class="overlay-title">Time to Rest Your Eyes</h1>
      <p class="overlay-subtitle">
        Focus your gaze on a distant object at least 20 feet away.<br>
        Blink naturally and take a deep breath.
      </p>

      <!-- Large Countdown Ring -->
      <div class="overlay-timer-ring">
        <svg class="overlay-ring-svg" viewBox="0 0 100 100">
          <circle class="overlay-ring-bg" cx="50" cy="50" r="44" fill="none"></circle>
          <circle id="overlay-ring-path" class="overlay-ring-progress" cx="50" cy="50" r="44" fill="none" stroke-dasharray="276.46" stroke-dashoffset="0"></circle>
        </svg>
        <span id="overlay-countdown" class="overlay-timer-text">00:20</span>
      </div>
    </main>

    <!-- Bypass & Snooze Action Bar -->
    <footer class="overlay-actions">
      <div class="bypass-buttons">
        <button class="btn-bypass" data-snooze="30">Pause 30 min</button>
        <button class="btn-bypass" data-snooze="60">Pause 1 hour</button>
        <button class="btn-bypass" data-snooze="120">Pause 2 hours</button>
        <button class="btn-bypass" data-snooze="tomorrow">Rest of Day</button>
      </div>
      <button id="skip-btn" class="btn-skip">Skip this break</button>
    </footer>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
